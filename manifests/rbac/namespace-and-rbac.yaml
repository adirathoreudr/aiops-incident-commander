# manifests/rbac/namespace-and-rbac.yaml
# Creates aiops namespace and least-privilege RBAC for each service.
# The agent and executor get only the permissions they actually need.

---
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
  labels:
    app.kubernetes.io/managed-by: aiops-incident-commander
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted

---
# ── ServiceAccounts ────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-collector
  namespace: aiops
  annotations:
    description: >-
      AIOps alert collector. Intentionally has no RBAC bindings: it never calls
      the Kubernetes API, reaching rollout history through the executor's /meta
      endpoints instead.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-agent
  namespace: aiops
  annotations:
    eks.amazonaws.com/role-arn: ""   # Set by Terraform output agent_iam_role_arn
    description: "AIOps reasoning agent — read incidents, no cluster write"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-executor
  namespace: aiops
  annotations:
    description: "AIOps executor — scoped write for restart/scale only"

---
# ── ClusterRole: cluster-wide read for discovery (executor /meta) ─────────
#
# The collector has no ServiceAccount-bound role at all: it never calls the
# Kubernetes API. It reads rollout history through the executor's /meta
# endpoints, so a cluster-wide reader role bound to it granted standing access
# to every pod and log in the cluster that nothing used.
#
# Reads stay cluster-wide because /meta/namespaces and /meta/deployments exist
# to discover what is out there. Writes do not — see below.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-executor-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-executor-reader
subjects:
  - kind: ServiceAccount
    name: aiops-executor
    namespace: aiops
roleRef:
  kind: ClusterRole
  name: aiops-executor-reader
  apiGroup: rbac.authorization.k8s.io

---
# ── Role: remediation writes, one namespace at a time ────────────────────
#
# This was a ClusterRole bound cluster-wide, which gave the executor patch and
# update on deployments in *every* namespace, kube-system included. The only
# thing standing between a bug in the policy engine and a rewrite of a system
# component was application code. Now the namespace allowlist in
# executor/policy.py is mirrored at the authorisation layer: the executor
# physically cannot write to a namespace nobody granted it.
#
# `patch` alone is enough — the dispatcher issues strategic-merge patches for
# both the restart annotation and the replica count — so `update`, which permits
# replacing the whole object, is not granted. `statefulsets` is dropped for the
# same reason: no action touches them.
#
# To let the platform remediate another namespace, copy the RoleBinding below
# into it. That is deliberately an explicit, auditable act.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-executor-remediator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-executor-remediator
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: aiops-executor
    namespace: aiops
roleRef:
  kind: ClusterRole
  name: aiops-executor-remediator
  apiGroup: rbac.authorization.k8s.io

---
# ── Role: agent read incidents from Redis (namespace-scoped) ──────────────

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-agent-role
  namespace: aiops
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
    resourceNames: ["aiops-agent-config"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-agent-role
  namespace: aiops
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops
roleRef:
  kind: Role
  name: aiops-agent-role
  apiGroup: rbac.authorization.k8s.io

# manifests/monitoring/alertmanager-config.yaml
#
# Routes critical and high alerts to the AIOps collector for AI triage.
#
# This was a plain ConfigMap named alertmanager-aiops-config. kube-prometheus-stack
# does not read Alertmanager configuration from an arbitrary ConfigMap — it
# assembles it from AlertmanagerConfig custom resources, or from a Secret it
# owns — so applying that file did precisely nothing. The routing looked
# configured and no alert ever reached the collector.
#
# An AlertmanagerConfig CR is the supported mechanism. It needs the Prometheus
# Operator CRDs; if you are not running the operator, use the Helm values
# snippet at the bottom instead.
#
# The bearer token is mandatory once COLLECTOR_API_TOKEN is set on the collector
# (see collector/auth.py) — without it ingestion fails silently and the platform
# looks healthy while seeing nothing. It is referenced from a Secret rather than
# inlined because this file is committed:
#
#   kubectl create secret generic alertmanager-aiops-token -n monitoring \
#     --from-literal=token="$COLLECTOR_API_TOKEN"
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: aiops-routing
  namespace: monitoring
  labels:
    # Must match the alertmanagerConfigSelector on your Alertmanager resource,
    # or the operator ignores this CR entirely.
    alertmanagerConfig: aiops
spec:
  route:
    receiver: default-receiver
    groupBy: ["alertname", "namespace", "service"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 3h
    routes:
      - receiver: aiops-webhook
        matchers:
          - name: severity
            matchType: "=~"
            value: "critical|high"
        groupWait: 10s
        groupInterval: 1m
        repeatInterval: 30m
        # Keep delivering to the default receiver too, so switching on AI triage
        # never silently replaces whoever is currently being paged.
        continue: true

  inhibitRules:
    # Suppress the warning when a critical is already firing for the same target.
    - sourceMatch:
        - name: severity
          value: critical
      targetMatch:
        - name: severity
          value: warning
      equal: ["namespace", "service", "alertname"]

  receivers:
    - name: default-receiver
      # Add your Slack/PagerDuty/email destination here.

    - name: aiops-webhook
      webhookConfigs:
        - url: http://aiops-collector.aiops.svc.cluster.local:8000/webhook/alertmanager
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-aiops-token
                key: token


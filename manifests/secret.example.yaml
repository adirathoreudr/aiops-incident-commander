# manifests/secret.example.yaml
#
# Template only — NOT applied by kustomization.yaml and not part of any deploy.
#
# A Secret carrying REPLACE_ME placeholders used to live inside
# aiops-platform.yaml. Because that file is applied on every deploy, each
# rollout overwrote whatever real credentials had been created, so the agent
# came back up holding the literal string "REPLACE_ME" and every LLM call
# failed. The documented setup even had you create the real secret first and
# then apply the manifest over it.
#
# Create the secret out of band instead. Either imperatively:
#
#   kubectl create secret generic aiops-secrets -n aiops \
#     --from-literal=openai-api-key="$OPENAI_API_KEY" \
#     --from-literal=argocd-token="$ARGOCD_TOKEN" \
#     --from-literal=executor-api-token="$(openssl rand -hex 32)" \
#     --from-literal=collector-api-token="$(openssl rand -hex 32)"
#
# or, preferably, have external-secrets-operator or sealed-secrets manage it so
# the values live in a real secret store and never pass through a shell history.
#
# Keys:
#   openai-api-key       LLM credential for the agent. Swap for anthropic-api-key
#                        if you point LLM_MODEL at a Claude model.
#   argocd-token         Optional. Required only for argocd_rollback actions.
#   executor-api-token   REQUIRED. The executor refuses every remediation
#                        request without it — see executor/auth.py.
#   collector-api-token  Protects /webhook/simulate, and /webhook/alertmanager
#                        once set. Alertmanager must send a matching bearer
#                        token or alert ingestion stops silently.
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops
type: Opaque
stringData:
  openai-api-key: "REPLACE_ME"
  argocd-token: "REPLACE_ME"
  executor-api-token: "REPLACE_ME"
  collector-api-token: "REPLACE_ME"

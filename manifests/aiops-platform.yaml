# manifests/aiops-platform.yaml
# Deploys: redis, aiops-collector, aiops-agent, aiops-executor
#
# Apply through kustomize from the repository root, not directly:
#
#   kubectl apply -k .
#
# Applying this file on its own skips the generated knowledge-base ConfigMaps and
# leaves the image placeholders unresolved, so the agent pod never starts.
#
# Every container satisfies the `restricted` Pod Security profile the namespace
# enforces (runAsNonRoot, allowPrivilegeEscalation=false, capabilities.drop ALL,
# seccompProfile RuntimeDefault); scripts/validate_manifests.py checks this in
# CI, because a manifest can be perfectly schema-valid and still be rejected at
# admission for omitting any one of them.
#
# readOnlyRootFilesystem is additional hardening beyond that profile. Each
# container gets a writable /tmp (or /data for Redis) to go with it. It has not
# been runtime-verified — there is no container runtime in the environment this
# was written in — so if a pod crash-loops on its first deploy with a
# read-only-filesystem error, that is the thing to look at first.

---
# ── Redis ─────────────────────────────────────────────────────────────────────

# A StatefulSet with a volume claim rather than a Deployment. Redis holds every
# incident and the audit trail the compliance copy promises to keep for 30 days;
# as a Deployment with no volume it wrote to the container filesystem, so a pod
# restart — a node drain, an eviction, an image update — silently discarded all
# of it. Persistence is also why the container asks for --appendonly.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: aiops
  labels:
    app: redis
    component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --dir
            - /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aiops
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ── Collector ─────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-collector
  namespace: aiops
  labels:
    app: aiops-collector
    component: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-collector
  template:
    metadata:
      labels:
        app: aiops-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aiops-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "REPLACE_WITH_ECR_URL/aiops-incident-commander/collector:latest"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: LOKI_URL
              value: "http://loki.monitoring.svc.cluster.local:3100"
            - name: K8S_API_URL
              value: "http://aiops-executor:8002"
            - name: COLLECTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: collector-api-token
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-collector
  namespace: aiops
  labels:
    app: aiops-collector
spec:
  selector:
    app: aiops-collector
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# ── Agent ─────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
    component: reasoning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aiops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "REPLACE_WITH_ECR_URL/aiops-incident-commander/agent:latest"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: openai-api-key
            - name: COLLECTOR_URL
              value: "http://aiops-collector:8000"
            - name: EXECUTOR_URL
              value: "http://aiops-executor:8002"
          volumeMounts:
            # Two mounts rather than one, because ConfigMap keys cannot contain
            # "/" and the agent reads runbooks/ and incidents/ as directories.
            - name: runbooks
              mountPath: /app/knowledge-base/runbooks
              readOnly: true
            - name: incidents
              mountPath: /app/knowledge-base/incidents
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: runbooks
          configMap:
            name: aiops-runbooks
        - name: incidents
          configMap:
            name: aiops-incidents
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-agent
  namespace: aiops
spec:
  selector:
    app: aiops-agent
  ports:
    - name: http
      port: 8001
      targetPort: 8001

---
# ── Executor ──────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-executor
  namespace: aiops
  labels:
    app: aiops-executor
    component: remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-executor
  template:
    metadata:
      labels:
        app: aiops-executor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aiops-executor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: "REPLACE_WITH_ECR_URL/aiops-incident-commander/executor:latest"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: aiops-config
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: argocd-token
                  optional: true
            - name: IN_CLUSTER
              value: "true"
            - name: EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: executor-api-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-executor
  namespace: aiops
spec:
  selector:
    app: aiops-executor
  ports:
    - name: http
      port: 8002
      targetPort: 8002

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  LLM_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0.1"
  AUTO_EXECUTE_THRESHOLD: "0.75"
  DEDUP_WINDOW_SECONDS: "120"
  RECOVERY_TIMEOUT_SECONDS: "120"
  MIN_CONFIDENCE_AUTO: "0.75"
  MIN_CONFIDENCE_HIGH_RISK: "0.90"
  BLOCKED_NAMESPACES: "kube-system,kube-public,cert-manager"
  HIGH_RISK_NAMESPACES: "production,prod"
  # Browser origins permitted to call the services. Was "*" on all three.
  # Set this to the dashboard's real origin before exposing anything.
  CORS_ALLOWED_ORIGINS: "http://localhost:3001"

---
# ── Ingress ───────────────────────────────────────────────────────────────────
#
# Every Service here is ClusterIP, so before this there was no way to reach the
# platform from outside the cluster at all — the docs told you to point the
# dashboard at "your collector LoadBalancer URL", and no LoadBalancer existed.
#
# Both hosts are exposed because the dashboard runs outside the cluster (Vercel)
# and proxies to them server-side. That means the executor's /approve is
# internet-reachable, which is only acceptable because it now requires a bearer
# token — before Phase 4 this Ingress would have been a remote,
# unauthenticated cluster-mutation endpoint.
#
# A tighter arrangement is to run the dashboard in-cluster and expose only it,
# leaving both services ClusterIP. That is the better posture if you ever move
# the UI off Vercel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops
  namespace: aiops
  annotations:
    # Terminate TLS and refuse plaintext: the API tokens travel in a header, so
    # an unencrypted hop would hand them to anyone on the path.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - collector.aiops.example.com
        - executor.aiops.example.com
      secretName: aiops-tls
  rules:
    - host: collector.aiops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-collector
                port:
                  number: 8000
    - host: executor.aiops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-executor
                port:
                  number: 8002

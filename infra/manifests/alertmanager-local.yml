# infra/manifests/alertmanager-local.yml
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: aiops-webhook
  routes:
    - matchers:
        - severity =~ "critical|high"
      receiver: aiops-webhook
      group_wait: 5s

receivers:
  - name: aiops-webhook
    webhook_configs:
      - url: http://collector:8000/webhook/alertmanager
        send_resolved: true
        # Must match COLLECTOR_API_TOKEN on the collector. The collector only
        # enforces a token on this endpoint once one is configured, but the
        # local stack sets one, so Alertmanager has to send it or ingestion
        # fails silently — the platform would look healthy and see nothing.
        #
        # Dev value only. In a real deployment use a file-based secret:
        #   authorization:
        #     type: Bearer
        #     credentials_file: /etc/alertmanager/secrets/collector-token
        http_config:
          authorization:
            type: Bearer
            credentials: dev-collector-token

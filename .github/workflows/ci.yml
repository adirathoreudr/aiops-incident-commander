# .github/workflows/ci.yml
# Triggered on every push and PR.
# Jobs: lint → test → ui-build → manifests → build (+ Trivy) → push to ECR
#
# The build and security-scan stages are here because cd.yml runs
# `kubectl set image ... :sha-<short>` against tags that nothing was producing:
# no workflow built an image, so a successful deploy would have pointed the
# cluster at references that do not exist in ECR.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff mypy types-redis

      - name: Ruff (collector)
        run: ruff check collector/ --select E,W,F,I

      - name: Ruff (agent)
        run: ruff check agent/ --select E,W,F,I

      - name: Ruff (executor)
        run: ruff check executor/ --select E,W,F,I

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI lint
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run type-check

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test deps
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r collector/requirements.txt
          pip install -r agent/requirements.txt
          pip install -r executor/requirements.txt

      # Each service writes its coverage report to its own path — a bare
      # --cov-report=xml puts every report at ./coverage.xml, so the last run
      # overwrites the others and the upload below references files that were
      # never created.
      - name: Run collector tests
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest collector/tests/ -v --cov=collector --cov-report=xml:collector/coverage.xml --cov-report=term-missing

      - name: Run agent tests
        env:
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: "test-key-not-real"
        run: pytest agent/tests/ -v --cov=agent --cov-report=xml:agent/coverage.xml --cov-report=term-missing

      - name: Run executor tests
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest executor/tests/ -v --cov=executor --cov-report=xml:executor/coverage.xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./collector/coverage.xml,./agent/coverage.xml,./executor/coverage.xml
          fail_ci_if_error: false

  # ── UI build check ──────────────────────────────────────────────────────────
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Next.js
        working-directory: ui
        run: |
          npm ci
          npm run build

  # ── Manifest validation ─────────────────────────────────────────────────────
  # There is no cluster in CI, so this is how the Kubernetes path is checked.
  # Schema validation alone is not enough: every Deployment here was once
  # schema-valid *and* rejected at admission, because the namespace enforces the
  # restricted Pod Security profile and a valid manifest can simply omit what
  # that profile requires.
  manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Render kustomization
        run: kubectl kustomize . > /tmp/rendered.yaml

      - name: Validate schemas
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered.yaml

      - name: Validate Pod Security and secret handling
        run: |
          pip install pyyaml
          python scripts/validate_manifests.py /tmp/rendered.yaml

  # ── Build, scan, push ───────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, manifests]
    permissions:
      id-token: write
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [collector, agent, executor]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Build once, load locally, scan, and only then push. Scanning after a
      # push would mean a CRITICAL finding is already in the registry and
      # possibly already deployed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to a full version tag. aquasecurity does not publish a floating
      # major tag, so a bare `0.24.0` / `@v0` style ref does not resolve and the
      # job dies at "Set up job" before any step runs.
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # Only main pushes to ECR, and only when the deploy role is configured —
      # a fork or a PR from one has no credentials and must not fail here.
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_CONFIGURED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_CONFIGURED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_CONFIGURED == 'true'
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/aiops-incident-commander/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/aiops-incident-commander/${{ matrix.service }}:latest
          cache-from: type=gha

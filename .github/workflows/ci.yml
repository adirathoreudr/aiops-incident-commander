# .github/workflows/ci.yml
# Triggered on every push and PR.
# Jobs: lint → test → ui-build
# Docker build & deploy live in cd.yml (main branch only, requires AWS secrets)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff mypy types-redis

      - name: Ruff (collector)
        run: ruff check collector/ --select E,W,F,I

      - name: Ruff (agent)
        run: ruff check agent/ --select E,W,F,I

      - name: Ruff (executor)
        run: ruff check executor/ --select E,W,F,I

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI lint
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run type-check

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test deps
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r collector/requirements.txt
          pip install -r agent/requirements.txt
          pip install -r executor/requirements.txt

      - name: Run collector tests
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest collector/tests/ -v --cov=collector --cov-report=xml --cov-report=term-missing

      - name: Run agent tests
        env:
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: "test-key-not-real"
        run: pytest agent/tests/ -v --cov=agent --cov-report=xml --cov-report=term-missing

      - name: Run executor tests
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest executor/tests/ -v --cov=executor --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./collector/coverage.xml,./agent/coverage.xml,./executor/coverage.xml
          fail_ci_if_error: false

  # ── UI build check ──────────────────────────────────────────────────────────
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Next.js
        working-directory: ui
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          npm ci
          npm run build
